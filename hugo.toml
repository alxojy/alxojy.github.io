# The deploy workflow overrides baseURL with your real GitHub Pages address,
# so you only need to change this if you build somewhere else.
baseURL = "https://example.github.io/"
locale = "en"
title = "Alex"

[params]
  description = "Alex writes software for a living, and about everything else here."
  # Leave avatar empty to show your initial, or drop a photo in static/images/ and set e.g. "images/me.jpg"
  avatar = ""
  # Optional "now" line under the about text. Delete to hide it.
  now = "projecting [V4] · navigating life"
  location = "Kuala Lumpur"

  [params.hero]
    kicker = "chalk · cats · commits"
    title = "Hello, world"
    subtitle = ""

  [params.about]
    title = "About me"
    text = "I'm Alex, I write software for a living (or I used to?). Outside of work you'll usually find me on the wall. I have a slight addiction to plastic rocks. Butler to four amazing cats."

  # Fill in your profile URLs. Leave one empty ("") to hide it.
  [params.social]
    linkedin = "https://www.linkedin.com/in/alex-jy-ooi/"
    github = "https://github.com/alxojy"

[permalinks]
  posts = "/:year/:contentbasename/"

[taxonomies]
  tag = "tags"

[markup.highlight]
  noClasses = false

[outputs]
  home = ["HTML", "RSS"]
