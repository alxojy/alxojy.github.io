{{ $s := site.Params.social }}
<footer id="elsewhere" class="site-footer" aria-labelledby="elsewhere-h">
  <h2 id="elsewhere-h">Elsewhere</h2>
  <div class="social-links">
    {{ with $s.linkedin }}
    <a class="social" href="{{ . }}" rel="me noopener" target="_blank">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="8" y1="10" x2="8" y2="16.5"/><circle cx="8" cy="7" r="0.6" fill="currentColor"/><path d="M12 16.5V10M12 13c0-1.8 1-3 2.5-3S17 11 17 12.6v3.9"/></svg>
      <span>LinkedIn</span><span class="arrow" aria-hidden="true">↗</span>
    </a>
    {{ end }}
    {{ with $s.instagram }}
    <a class="social" href="{{ . }}" rel="me noopener" target="_blank">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="0.6" fill="currentColor"/></svg>
      <span>Instagram</span><span class="arrow" aria-hidden="true">↗</span>
    </a>
    {{ end }}
    {{ with $s.github }}
    <a class="social" href="{{ . }}" rel="me noopener" target="_blank">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/></svg>
      <span>GitHub</span><span class="arrow" aria-hidden="true">↗</span>
    </a>
    {{ end }}
  </div>
  <div class="fineprint">
    <span>© {{ now.Year }} {{ site.Title }}{{ with site.Params.location }} · {{ . }}{{ end }}</span>
    <span>thanks for stopping by</span>
  </div>
</footer>
